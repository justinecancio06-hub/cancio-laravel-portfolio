<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Pixel Art Editor</title>
  <desc id="desc">Placeholder preview for the Pixel Art Editor 16x16 grid painter</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14141c"/>
      <stop offset="1" stop-color="#101c28"/>
    </linearGradient>
    <pattern id="pixels" width="25" height="25" patternUnits="userSpaceOnUse">
      <rect width="25" height="25" fill="none" stroke="#2a2a36" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="300" y="260" width="200" height="100" fill="url(#pixels)"/>
  <text x="400" y="205" fill="#0ea5b7" font-family="Sora, Segoe UI, sans-serif" font-size="44" font-weight="700" text-anchor="middle">Pixel Art Editor</text>
  <text x="400" y="245" fill="#9a9aa5" font-family="Segoe UI, sans-serif" font-size="18" text-anchor="middle">16x16 Grid Painter</text>
</svg>
